name: Full CI

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NASM on Windows
        if: runner.os == 'Windows'
        run: choco install nasm --yes --no-progress
      - name: Install NASM on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes nasm
      - name: Configure Windows x64 linker
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Run all workspace tests
        run: cargo test --locked --workspace --all-targets
