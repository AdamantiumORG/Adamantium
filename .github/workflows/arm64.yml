name: ARM64 backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-compile:
    name: Cross-compile ARM64 objects from x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            object: arm64-linux.o
            container: "ELF"
            architecture: "ARM aarch64|AArch64|ARM64"
          - target: aarch64-pc-windows-msvc
            object: arm64-windows.obj
            container: "COFF"
            architecture: "Aarch64|ARM64"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Emit target-specific LLVM IR
        run: cargo run --locked -p adamantium-codegen --example arm64-smoke -- ${{ matrix.target }} arm64-smoke.ll
      - name: Cross-compile object on x86-64 host
        run: clang -target ${{ matrix.target }} -c arm64-smoke.ll -o ${{ matrix.object }}
      - name: Verify target object format
        shell: bash
        env:
          CONTAINER: ${{ matrix.container }}
          ARCHITECTURE: ${{ matrix.architecture }}
          OBJECT: ${{ matrix.object }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          description="$(file "$OBJECT")"
          echo "$description"
          grep -F "$CONTAINER" <<< "$description"
          grep -E "$ARCHITECTURE" <<< "$description"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-compiled-${{ matrix.target }}-object
          path: ${{ matrix.object }}
          if-no-files-found: error

  native:
    name: Native LLVM (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: arm64-smoke.exe
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            executable: arm64-smoke
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test ARM64 backend crates
        run: cargo test --locked -p adamantium-codegen -p adamantium-linker -p adamantium-stdlib
      - name: Build the native ARM64 CLI and embedded runtime
        run: cargo build --locked --release -p adamantium-cli
      - name: Emit LLVM ARM64 module
        run: cargo run --locked -p adamantium-codegen --example arm64-smoke -- ${{ matrix.target }} arm64-smoke.ll
      - name: Build native ARM64 executable
        run: clang -target ${{ matrix.target }} arm64-smoke.ll -o ${{ matrix.executable }}
      - name: Run native ARM64 executable
        shell: pwsh
        run: |
          & (Join-Path $PWD '${{ matrix.executable }}')
          if ($LASTEXITCODE -ne 0) {
            throw "Generated ARM64 executable returned $LASTEXITCODE."
          }
      - name: Build and verify ARM64 packaging regression archive
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: ./scripts/test-arm64-package.ps1
      - name: Upload ARM64 packaging regression archive
        uses: actions/upload-artifact@v4
        with:
          name: adamantium-${{ matrix.target }}-packaging-smoke
          path: dist/adamantium-${{ matrix.target }}-packaging-smoke.zip
          if-no-files-found: error
