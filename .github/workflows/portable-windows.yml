name: Portable Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Windows x64 linker
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build portable package
        shell: powershell
        run: ./scripts/package-windows.ps1

      - name: Build Windows installer
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          $env:ADAMANTIUM_VERSION = '${{ github.ref_name }}'.TrimStart('v')
          if (-not $env:ADAMANTIUM_VERSION) { $env:ADAMANTIUM_VERSION = '0.1.0-dev' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            '/DSourceRoot=..\dist\adamantium-windows-x86_64' `
            'scripts\adamantium.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: adamantium-windows-x86_64
          path: |
            dist/adamantium-windows-x86_64.zip
            dist/adamantium-windows-x86_64.zip.sha256
            dist/adamantium-windows-x86_64-installer.exe
          if-no-files-found: error

      - name: Publish tagged portable package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/adamantium-windows-x86_64.zip
            dist/adamantium-windows-x86_64.zip.sha256
            dist/adamantium-windows-x86_64-installer.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
