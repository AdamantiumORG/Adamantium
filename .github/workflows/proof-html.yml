name: Proof HTML

on:
  workflow_run:
    workflows: ["CLI Tests"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-html-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Require upstream success
    if: ${{ github.event_name != 'workflow_dispatch' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "Workflow '${{ github.event.workflow_run.name }}' concluded with '${{ github.event.workflow_run.conclusion }}'; not running Proof HTML."
          exit 1

  proof-html:
    name: Check documentation links
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Check HTML and Markdown links
        uses: anishathalye/proof-html@v1.1.0
        with:
          directory: ./