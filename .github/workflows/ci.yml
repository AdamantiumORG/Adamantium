name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  affected:
    name: Find affected crates
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.graph.outputs.crates }}
      cli: ${{ steps.graph.outputs.cli }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: graph
        name: Compute changed crates and downstream dependents
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            crates="$(cargo run -q -p adamantium-testing --bin affected-crates -- --changed Cargo.toml)"
          else
            crates="$(cargo run -q -p adamantium-testing --bin affected-crates -- "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          echo "crates=${crates}" >> "$GITHUB_OUTPUT"
          if echo "$crates" | grep -q 'adamantium-cli'; then echo 'cli=true' >> "$GITHUB_OUTPUT"; else echo 'cli=false' >> "$GITHUB_OUTPUT"; fi

  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - uses: taiki-e/install-action@v2
        with:
          tool: typos@1.49.0
      - run: typos .

  crate:
    name: ${{ matrix.crate }} (${{ matrix.os }})
    needs: affected
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        crate: ${{ fromJSON(needs.affected.outputs.crates) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install NASM on Windows
        if: runner.os == 'Windows' && matrix.crate == 'adamantium-cli'
        run: choco install nasm --yes --no-progress
      - name: Install NASM on Linux
        if: runner.os == 'Linux' && matrix.crate == 'adamantium-cli'
        run: sudo apt-get update && sudo apt-get install --yes nasm
      - name: Configure Windows x64 linker
        if: runner.os == 'Windows' && matrix.crate == 'adamantium-cli'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cargo check --locked -p ${{ matrix.crate }} --all-targets
      - run: cargo clippy --locked -p ${{ matrix.crate }} --all-targets -- -D warnings
      - run: cargo test --locked -p ${{ matrix.crate }} --all-targets
      - run: cargo build --locked --release -p ${{ matrix.crate }}

  native-cli:
    name: Native CLI (${{ matrix.os }})
    if: needs.affected.outputs.cli == 'true'
    needs: affected
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Windows'
        run: choco install nasm --yes --no-progress
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes nasm
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - if: runner.os == 'Windows'
        run: cargo test --locked -p adamantium-cli --test native -- --ignored
      - if: runner.os == 'Linux'
        run: cargo test --locked -p adamantium-cli --test native_linux -- --ignored
