name: Fuzzing

on:
  push:
    paths:
      - "fuzz/**"
      - "crates/adamantium-lexer/**"
      - "crates/adamantium-parser/**"
      - "crates/adamantium-compiler/**"
      - "crates/adamantium-semantics/**"
      - "crates/adamantium-lowering/**"
      - "crates/adamantium-ir/**"
      - "crates/adamantium-codegen/**"
      - "crates/adamantium-runtime/**"
      - "crates/adamantium-wasm/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/adamantium-lexer/**"
      - "crates/adamantium-parser/**"
      - "crates/adamantium-compiler/**"
      - "crates/adamantium-semantics/**"
      - "crates/adamantium-lowering/**"
      - "crates/adamantium-ir/**"
      - "crates/adamantium-codegen/**"
      - "crates/adamantium-runtime/**"
      - "crates/adamantium-wasm/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      RUSTFLAGS: -C target-feature=-crt-static
    strategy:
      fail-fast: false
      matrix:
        target: [lexer, frontend, pipeline, codegen, runtime, package_loader]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run bounded fuzz target
        shell: bash
        run: |
          rustc --version --verbose
          cargo fuzz run "${{ matrix.target }}" \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time=60 -timeout=10
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
