name: CLI Tests

on:
  workflow_call:
    inputs:
      head_sha:
        description: Commit that passed the preceding CI stages
        required: true
        type: string
      publish_nightly:
        description: Publish portable Nightly archives
        required: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-windows:
    name: Test CLI (Windows x86-64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install NASM
        run: choco install nasm --yes --no-progress
      - name: Configure Windows x64 linker
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify Rust host
        shell: pwsh
        run: |
          $rustcInfo = (rustc --version --verbose) -join "`n"
          Write-Output $rustcInfo
          if ($rustcInfo -notmatch '(?m)^host: x86_64-pc-windows-msvc$') {
            throw 'The Windows CLI test must run on x86-64 MSVC.'
          }
      - name: Run native Windows language tests
        run: cargo test --locked -p adamantium-cli --test native -- --ignored
      - name: Install Adamantium CLI
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'adamantium-cli'
          cargo install --path crates/adamantium-cli --locked --force --root $installRoot
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $installRoot 'bin')
      - name: Test installed CLI
        shell: pwsh
        run: ./scripts/test-cli-windows.ps1

  cli-linux:
    name: Test CLI (Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install --yes nasm
      - name: Verify Linux x86-64 host
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          test "$(rustc --version --verbose | sed -n 's/^host: //p')" = "x86_64-unknown-linux-gnu"
          test "$(uname -m)" = "x86_64"
      - name: Run native Linux language tests
        run: cargo test --locked -p adamantium-cli --test native_linux -- --ignored
      - name: Install Adamantium CLI
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/adamantium-cli"
          cargo install --path crates/adamantium-cli --locked --force --root "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"
      - name: Test installed CLI
        shell: bash
        run: bash scripts/test-cli-linux.sh

  nightly-windows:
    name: Publish Windows Nightly
    if: ${{ success() && inputs.publish_nightly }}
    needs: [cli-windows, cli-linux]
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: adamantium-nightly-release
    env:
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Configure Windows x64 linker
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and verify portable package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Prepare Nightly assets
        shell: pwsh
        run: |
          $source = 'dist/adamantium-windows-x86_64.zip'
          $asset = 'dist/windows_portable_x86_64.zip'
          Copy-Item -LiteralPath $source -Destination $asset
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  windows_portable_x86_64.zip" |
            Set-Content -LiteralPath "$asset.sha256" -Encoding ASCII
      - name: Upload Nightly workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows_portable_x86_64
          path: |
            dist/windows_portable_x86_64.zip
            dist/windows_portable_x86_64.zip.sha256
          if-no-files-found: error
      - name: Move Nightly tag to tested commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/nightly" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/nightly" `
              -f sha="$env:HEAD_SHA" -F force=true *> $null
          } else {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
              -f ref='refs/tags/nightly' -f sha="$env:HEAD_SHA" *> $null
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the Nightly tag.' }
      - name: Create or update Nightly release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit nightly --title 'Nightly' --prerelease --latest=false `
              --notes 'Automatically updated after the Windows and Linux CLI tests pass in their platform workflows.'
          } else {
            gh release create nightly --title 'Nightly' --prerelease --latest=false `
              --notes 'Automatically updated after the Windows and Linux CLI tests pass in their platform workflows.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create or update the Nightly release.' }
          gh release upload nightly `
            dist/windows_portable_x86_64.zip `
            dist/windows_portable_x86_64.zip.sha256 `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the Nightly assets.' }

  nightly-linux:
    name: Publish Linux Nightly
    if: ${{ success() && inputs.publish_nightly }}
    needs: [cli-windows, cli-linux]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: adamantium-nightly-release
    env:
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm zip
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Build and verify portable package
        shell: bash
        run: bash scripts/package-linux.sh
      - name: Prepare Nightly assets
        shell: bash
        run: |
          cp dist/adamantium-linux-x86_64.zip dist/linux_portable_x86_64.zip
          cd dist
          sha256sum linux_portable_x86_64.zip > linux_portable_x86_64.zip.sha256
      - name: Upload Nightly workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux_portable_x86_64
          path: |
            dist/linux_portable_x86_64.zip
            dist/linux_portable_x86_64.zip.sha256
          if-no-files-found: error
      - name: Move Nightly tag to tested commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$HEAD_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/nightly' -f sha="$HEAD_SHA" >/dev/null
          fi
      - name: Create or update Nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes='Automatically updated after the Windows and Linux CLI tests pass in their platform workflows.'
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title 'Nightly' --prerelease --latest=false --notes "$notes"
          else
            gh release create nightly --title 'Nightly' --prerelease --latest=false --notes "$notes"
          fi
          gh release upload nightly \
            dist/linux_portable_x86_64.zip \
            dist/linux_portable_x86_64.zip.sha256 \
            --clobber
