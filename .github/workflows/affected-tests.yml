name: Affected Tests

on:
  workflow_call:
    inputs:
      crates:
        description: A JSON array containing crates to test
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.crate }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        crate: ${{ fromJSON(inputs.crates) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NASM on Windows
        if: runner.os == 'Windows' && matrix.crate == 'adamantium-cli'
        run: choco install nasm --yes --no-progress
      - name: Install NASM on Linux
        if: runner.os == 'Linux' && matrix.crate == 'adamantium-cli'
        run: sudo apt-get update && sudo apt-get install --yes nasm
      - name: Configure Windows x64 linker
        if: runner.os == 'Windows' && matrix.crate == 'adamantium-cli'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Test crate
        run: cargo test --locked -p ${{ matrix.crate }} --all-targets
