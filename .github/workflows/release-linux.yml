name: Stable Linux release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install --yes nasm zip
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Build and verify Linux portable archive
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: adamantium-linux-x86_64
          path: |
            dist/adamantium-linux-x86_64.zip
            dist/adamantium-linux-x86_64.zip.sha256
          if-no-files-found: error
      - name: Attach Linux assets to stable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/adamantium-linux-x86_64.zip
            dist/adamantium-linux-x86_64.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
